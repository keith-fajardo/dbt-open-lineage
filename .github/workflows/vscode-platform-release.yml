name: VS Code platform release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build engine ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/vscode/requirements-lineage-build.txt

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e 'const actual=`${process.platform}-${process.arch}`; if(actual!==process.env.EXPECTED_TARGET) throw new Error(`expected ${process.env.EXPECTED_TARGET}, got ${actual}`)'

      - run: npm ci
      - run: python -m pip install --requirement packages/vscode/requirements-lineage-build.txt
      - name: Test extension host logic
        run: npm run test -w packages/vscode
      - name: Test bundled lineage engine
        run: python -m unittest discover -s packages/vscode/python -p "test_*.py"
      - run: npm run build:lineage -w packages/vscode

      # Upload only the platform engine. The universal VSIX is assembled once
      # (below) from all four engines — each can only be built on its own OS
      # because PyInstaller cannot cross-compile.
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: packages/vscode/bin/${{ matrix.target }}
          if-no-files-found: error

  assemble:
    name: Assemble universal VSIX
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download every platform engine
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: engines

      - name: Stage engines under packages/vscode/bin/<target>
        shell: bash
        run: |
          set -euo pipefail
          for dir in engines/engine-*; do
            target="${dir#engines/engine-}"
            mkdir -p "packages/vscode/bin/$target"
            cp -R "$dir"/. "packages/vscode/bin/$target/"
          done
          # upload-artifact drops the Unix exec bit; restore it so the packaged
          # non-Windows engines spawn at runtime.
          for target in linux-x64 darwin-arm64 darwin-x64; do
            chmod +x "packages/vscode/bin/$target/lineage-engine"
          done
          ls -R packages/vscode/bin

      - name: Build extension host + webview
        run: npm run build -w packages/vscode

      - name: Package universal VSIX
        run: npm run package:universal -w packages/vscode

      - uses: actions/upload-artifact@v4
        with:
          name: dbt-open-lineage-universal
          path: packages/vscode/dbt-open-lineage-*.vsix
          if-no-files-found: error
